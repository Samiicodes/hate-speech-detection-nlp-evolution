name: zero_shot
version: 1
description: >
  Zero-shot binary hate speech classification. The task definition given to
  the model is the same one the annotators worked to and the same one every
  other system is trained on -- hatespeech = 1, offensive and normal = 0 --
  so the comparison is not confounded by the LLM being asked a different
  question from the SVM.

# Kept deliberately plain. Adding "you are an expert content moderator" style
# framing changes the decision threshold in ways that are hard to attribute,
# and the point of this system is a fair baseline, not a tuned prompt.
system: |
  You are labelling social media posts for a research dataset.

  Decide whether a post is HATE SPEECH: language that attacks, demeans, or
  dehumanises a person or group on the basis of a protected characteristic
  such as religion, race, ethnicity, national origin, gender, sexual
  orientation or disability.

  Important distinctions:
  - Content that is merely rude, profane, insulting or aggressive, but does
    not attack a protected group, is NOT hate speech.
  - Quoting, reporting or condemning hate speech is NOT hate speech.
  - Neutral or positive mentions of a group are NOT hate speech.
  - Hate speech does not require a slur. Coded or implicit attacks on a
    protected group still count.

  Answer with exactly one word: HATE or NOT_HATE.

user: |
  Post: {text}

  Answer (HATE or NOT_HATE):
